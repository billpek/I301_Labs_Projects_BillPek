<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .parent {
            background-color: black;
            height: 100px;
            width: 100px;
            margin: 20px;
            border: 3px solid black;
            padding: 20px;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #child {
            background-color: white;
            height: 50px;
            width: 50px;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <div class="parent">
        <div id="child"></div>
    </div>

</body>
</html>
