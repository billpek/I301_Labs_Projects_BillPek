<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts </title>

    <style>
       body {
          background-color: #f0f2f5;
          font-family: Helvetica, Arial, sans-serif;
       }

       form {
          min-height: 180px;
       }

       article, form {
          background-color: #ffffff;
          border-radius: 8px;
          box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
          padding: 12px 16px;
          margin-bottom: 16px;
          max-width: 680px;
          margin-left: auto;
          margin-right: auto;
       }

       h2 {
          color: #050505;
          font-size: 0.9375rem;
          font-weight: 600;
          margin: 0 0 4px 0;
       }

       p {
          color: #050505;
          font-size: 0.9375rem;
          line-height: 1.3333;
          margin: 8px 0 0 0;
       }
    </style>
</head>

<body>
<h1> Welcome to my Posts page! </h1>

    <form action="#">

        <label for="userID">Select User:</label>
        <select id="userID">
            <option value="">--Please choose an option--</option>
            <option value="1">User 1</option>
            <option value="2">User 2</option>
            <option value="3">User 3</option>
            <option value="4">User 4</option>
            <option value="5">User 5</option>
            <option value="6">User 6</option>
            <option value="7">User 7</option>
        </select>

        <button type="button" id="filterBtn">Filter</button>

        <br><br>

        <label for="displayUserID">Enter User ID:</label>
        <input type="number" id="displayUserID" min="1" max="10">

        <button type="button" id="displayUserBtn">Display User Posts</button>

        <br><br>

        <label for="postID">Enter Post ID:</label>
        <input type="number" id="postID" min="1" max="100">

        <button type="button" id="findBtn">Find</button>

    </form>

    <script>
        let info;
        fetch('https://jsonplaceholder.typicode.com/posts')
        .then(response => response.json())
        .then(data => {
            info = data;
            console.table(info);
            for (let i = 0; i < info.length; i++) {
                let article = document.createElement('article');
                let ID1 = document.createElement('h2');
                let h2 = document.createElement('h2');
                let p = document.createElement('p');
                ID1.textContent = `UserId: ${info[i].userId} | ID: ${info[i].id}`;
                h2.textContent = info[i].title;
                p.textContent = info[i].body;
                article.appendChild(ID1);
                article.appendChild(h2);
                article.appendChild(p);
                document.body.appendChild(article);
            }
        });

        let button = document.getElementById('filterBtn');
        button.addEventListener('click', function(){
            let id = document.getElementById('userID');
            let value = Number(id.value);
            let posts = info.filter(post => post.userId === value);
            for (let i = 0; i < posts.length; i++){
                let title = posts[i].title;
                let body = posts[i].body;
                console.log(`UserID: ${value} | Title: ${title} | Body: ${body}`);
            }
        });

        let displayID = document.getElementById('displayUserBtn');
        displayID.addEventListener('click', function(){
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            let id = document.getElementById('displayUserID');
            let value = Number(id.value);
            let filtered = info.filter(post => post.userId === value);
            for (let i = 0; i < filtered.length; i++){
                let article = document.createElement('article');
                let ID = document.createElement('h2');
                let h2 = document.createElement('h2');
                let p = document.createElement('p');
                ID.textContent = `UserId: ${filtered[i].userId}`;
                h2.textContent = filtered[i].title;
                p.textContent = filtered[i].body;
                article.appendChild(ID);
                article.appendChild(h2);
                article.appendChild(p);
                document.body.appendChild(article);
            }
        });

        let fin = document.getElementById('findBtn');
        fin.addEventListener('click', function(){
            document.querySelectorAll('article').forEach((article) => {
                article.remove();
            });
            let val = document.getElementById('postID');
            let num = Number(val.value);
            let pos = info.find(post => post.id === num);
            if (pos){
                let article = document.createElement('article');
                let ID = document.createElement('h2');
                let h2 = document.createElement('h2');
                let p = document.createElement('p');
                ID.textContent = `Post Id: ${pos.id}`;
                h2.textContent = pos.title;
                p.textContent = pos.body;
                article.appendChild(ID);
                article.appendChild(h2);
                article.appendChild(p);
                document.body.appendChild(article);
            } else {
                let article = document.createElement('article');
                let h2 = document.createElement('h2');
                h2.textContent = 'Post not found';
                article.appendChild(h2);
                document.body.appendChild(article);
            }
        });
    </script>

</body>
</html>
