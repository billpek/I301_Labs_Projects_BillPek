<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
</head>
<body>
    <form>
        Name: <input type="text" id="name"><br>
        Number 1: <input type="number" id="num1"><br>
        Number 2: <input type="number" id="num2"><br>

        <input type="radio" name="op" value="+">Add<br>
        <input type="radio" name="op" value="-">Subtract<br>
        <input type="radio" name="op" value="*">Multiply<br>
        <input type="radio" name="op" value="/">Divide<br>

        <button type="button" id="calc">Calculate</button>
        <button type="reset" id="clear">Clear</button>
    </form>

    <p id="greeting"></p>
    <p id="result"></p>

    <script>
        document.getElementById('calc').addEventListener('click', function () {
            const name = document.getElementById('name').value;
            const a = Number(document.getElementById('num1').value);
            const b = Number(document.getElementById('num2').value);
            const op = document.querySelector('[name=op]:checked').value;
            let answer;

            if (op === '+') answer = a + b;
            if (op === '-') answer = a - b;
            if (op === '*') answer = a * b;
            if (op === '/') answer = a / b;

            document.getElementById('greeting').textContent = `Hey there, ${name}!`;
            document.getElementById('result').textContent = `Result: ${answer}`;
        });

        document.getElementById('clear').addEventListener('click', function () {
            document.getElementById('greeting').textContent = '';
            document.getElementById('result').textContent = '';
        });
    </script>
</body>
</html>
