<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masonry</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        #page {
            display: flex;
            height: 100vh;
        }

        #left {
            width: 120px;
            flex-shrink: 0;
            background-color: orange;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        #trash {
            margin-top: auto;
            margin-bottom: 0;
        }

        #right {
            flex: 1;
            overflow-y: auto;
        }

        #masonry {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }

        #masonry img {
            height: 150px;
            flex-grow: 1;
            padding: 3px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="page">

        <div id="left">
            <div class="icon">&#x1F4F7;</div>
            <div class="icon">&#x1F5C4;&#xfe0f;</div>
            <div class="icon">&#x2764;&#xfe0f;</div>
            <div class="icon" id="trash">&#x1F5D1;&#xfe0f;</div>
        </div>

        <div id="right">
            <div id="masonry">
                <img src="https://picsum.photos/347/100" alt="Photo 1">
