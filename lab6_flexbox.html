<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #par {
            border: 1px solid black;
            height: 100vh;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            align-items: center;
        }

        #img1 {
            width: 200px;
            height: 200px;
            margin: 10px;
        }

        #img2 {
            width: 300px;
            height: 300px;
            margin: 10px;
        }

        #img3 {
            width: 200px;
            height: 200px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <div id="par">
        <img id="img1" src="https://picsum.photos/200/200?random=3" alt="Image 1">
        <img id="img2" src="https://picsum.photos/300/300?random=6" alt="Image 2">
        <img id="img3" src="https://picsum.photos/200/200?random=5" alt="Image 3">
    </div>
</body>
</html>
